/change_memory:
  ros__parameters:
    use_sim_time: true
    map_topic: /map
    scan_topic: /scan
    map_frame: map
    base_frame: base_footprint
    memory_path: ~/.ros/resilient_amr/environment_memory.json
    occupied_threshold: 65
    confirm_observations: 5
    clear_observations: 5
    confirm_min_duration_sec: 2.0
    clear_min_duration_sec: 2.0
    min_observation_interval_sec: 0.25
    save_every_scans: 5
/astar_planner:
  ros__parameters:
    use_sim_time: true
    map_topic: /map
    map_frame: map
    base_frame: base_footprint
    occupied_threshold: 65
    obstacle_inflation_cells: 11
/path_follower:
  ros__parameters:
    use_sim_time: true
    action_name: /follow_path
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
/task_manager:
  ros__parameters:
    use_sim_time: true
    shelf_ids: [A, B, C]
    shelf_marker_ids: [1, 2, 3]
    shelf_x: [1.0, 2.0, 3.0]
    shelf_y: [0.0, 0.0, 0.0]
    shelf_yaw: [0.0, 0.0, 0.0]
    dropoff_marker_id: 4
    dropoff_x: 0.0
    dropoff_y: 0.0
    dropoff_yaw: 0.0
    marker_confirmations: 2
/aruco_detector:
  ros__parameters:
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    map_frame: map
    base_frame: base_footprint
    dictionary: DICT_4X4_50
    marker_size_m: 0.10
    reference_marker_ids: []
    reference_marker_poses: []
